name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches both package versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$tag' is not a strict semver tag (vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          version="${tag#v}"
          root="$(node -p 'require("./package.json").version')"
          protocol="$(node -p 'require("./packages/protocol/package.json").version')"
          if [ "$version" != "$root" ] || [ "$version" != "$protocol" ]; then
            echo "::error::tag '$tag' does not match @pty-server/ptys $root and @pty-server/protocol $protocol"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run docs:check
      - run: npm install -g npm@12.0.1
      - run: node scripts/publish-workspaces.mjs
